[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-desktop-mcp"  # نفس الاسم الذي وضعته في PyPI
version = "0.1.0"
description = "A Telegram MCP server to control Telegram and read PDFs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "telethon>=1.36.0",
    "pypdf>=4.0.0",
    "qrcode>=7.4.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
telegram-mcp = "server:main"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]